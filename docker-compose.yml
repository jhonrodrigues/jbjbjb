services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jb_agent}
      POSTGRES_USER: ${POSTGRES_USER:-jb_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jb_agent} -d ${POSTGRES_DB:-jb_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-jb_agent}
      PGUSER: ${POSTGRES_USER:-jb_agent}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      DATABASE_SSL: "false"
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no .env}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Defina INTERNAL_API_SECRET no .env}
      UPLOAD_DIR: /app/uploads
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    networks:
      - internal

volumes:
  postgres_data:
  uploads:

networks:
  internal:
